# ActionMetrics — Frontend (Next.js)
#
# Proxy inverso hacia el contenedor del frontend (docker compose publica 127.0.0.1:3000).
# Reemplaza "tudominio.com" por tu dominio (ver deploy/README.md).
# Instalar en: /etc/nginx/sites-available/actionmetrics-frontend.conf

upstream actionmetrics_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_tokens off;
    server_name tudominio.com www.tudominio.com;

    return 301 https://tudominio.com$request_uri;
}

# www -> dominio principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_tokens off;
    server_name www.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    include /etc/nginx/snippets/actionmetrics-ssl.conf;

    return 301 https://tudominio.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_tokens off;
    server_name tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    include /etc/nginx/snippets/actionmetrics-ssl.conf;

    # Solo HTTPS en adelante (CSP, X-Frame-Options, etc. los envía Next.js)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # El frontend no recibe subidas: limitar el tamaño de las peticiones
    client_max_body_size 1m;

    # Next.js ya envía Cache-Control "immutable" para /_next/static (caché larga en el navegador)
    location / {
        proxy_pass http://actionmetrics_frontend;
        include /etc/nginx/snippets/actionmetrics-proxy.conf;
    }
}
