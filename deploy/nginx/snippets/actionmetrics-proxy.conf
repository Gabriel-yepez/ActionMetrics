# Cabeceras comunes para el proxy hacia los contenedores de ActionMetrics.
# Instalar en: /etc/nginx/snippets/actionmetrics-proxy.conf

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
# IP real del cliente: se sobrescribe (no se concatena) para que no se pueda falsificar.
# El backend la usa para el rate limiting (TRUST_PROXY=1).
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Timeouts: los valores por defecto de Nginx (60s); /api/reportes los amplía para la IA.
