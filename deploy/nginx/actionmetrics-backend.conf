# ActionMetrics — Backend (API Express)
#
# Proxy inverso hacia el contenedor del backend (docker compose publica 127.0.0.1:4001).
# Sirve la API (/api), los documentos (/document) y los reportes PDF (/reports).
# Reemplaza "tudominio.com" por tu dominio (ver deploy/README.md).
# Instalar en: /etc/nginx/sites-available/actionmetrics-backend.conf
#
# El frontend y la API deben ser subdominios del mismo dominio (tudominio.com y
# api.tudominio.com): la cookie de sesión es SameSite=Strict y los PDFs se muestran en iframes.

upstream actionmetrics_backend {
    server 127.0.0.1:4001;
    keepalive 32;
}

# Primera barrera contra fuerza bruta en el login (el backend tiene su propio límite)
limit_req_zone $binary_remote_addr zone=actionmetrics_auth:10m rate=10r/m;

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_tokens off;
    server_name api.tudominio.com;

    return 301 https://api.tudominio.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_tokens off;
    server_name api.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    include /etc/nginx/snippets/actionmetrics-ssl.conf;

    # HSTS y el resto de cabeceras de seguridad las envía el backend (helmet)

    # Documentos de hasta 10 MB (límite de multer) + margen del multipart
    client_max_body_size 12m;

    # Respuestas JSON comprimidas (Express no comprime)
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # Solo login y registro (no /api/auth/me, que el frontend consulta al navegar)
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=actionmetrics_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://actionmetrics_backend;
        include /etc/nginx/snippets/actionmetrics-proxy.conf;
    }

    # Los reportes con IA esperan la respuesta de DeepSeek: dar más tiempo
    location /api/reportes {
        proxy_pass http://actionmetrics_backend;
        include /etc/nginx/snippets/actionmetrics-proxy.conf;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://actionmetrics_backend;
        include /etc/nginx/snippets/actionmetrics-proxy.conf;
    }
}
